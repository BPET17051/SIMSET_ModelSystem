<header class="topbar">
    <button id="btn-menu-toggle" class="btn-menu-toggle" aria-label="เปิดเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>
    <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">ภาพรวมระบบ SiMSET</div>
    </div>
    <div class="topbar-right">
        <button id="btn-global-refresh" class="btn-topbar-refresh" title="รีเฟรชข้อมูลหน้านี้"
            aria-label="รีเฟรช">
            <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span class="refresh-label">รีเฟรช</span>
        </button>
        <div class="live-indicator" title="อัปเดตอัตโนมัติเมื่อมีการรีเฟรชข้อมูล">
            <div class="live-dot"></div>
            <span class="live-text">AUTO</span>
        </div>
        <span class="last-sync" id="last-sync">โหลดข้อมูล...</span>
    </div>
</header>
