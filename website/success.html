<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>SIMSET Borrow - Receipt</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/simset-borrow.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="sb-logo-mark">S</span>
          <span class="sb-brand-text">SIMSET Borrow</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
            <li class="nav-item"><a class="nav-link" href="index.html">หน้าหลัก</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html">รายการอุปกรณ์</a></li>
            <li class="nav-item"><a class="nav-link" href="track.html">ติดตามคำขอ</a></li>
            <li class="nav-item"><a class="nav-link" href="history.html">ประวัติ</a></li>
          </ul>
          <a class="btn btn-brand btn-sm active" href="cart.html">
            <i class="bi-cart-fill me-1"></i>รายการยืม
            <span class="btn-brand-badge ms-1" data-cart-count>0</span>
          </a>
        </div>
      </div>
    </nav>
    <main class="py-5">
      <div class="container px-4 px-lg-5">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="bg-white border rounded p-4">
              <h1 class="h3">Borrow request submitted</h1>
              <p class="text-muted">Keep this confirmation for tracking and pickup coordination.</p>
              <div id="success-message" class="alert d-none"></div>
              <div id="receipt-content"></div>
              <div class="d-flex gap-2 mt-4">
                <button id="print-receipt" class="btn btn-dark" type="button">Print</button>
                <a id="claim-link" class="btn btn-outline-dark" href="history.html">Save to my history</a>
                <a id="track-link" class="btn btn-outline-dark" href="track.html">Track request</a>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="bg-white border rounded p-4 text-center">
              <h2 class="h5">Tracking QR</h2>
              <img id="tracking-qr" class="img-fluid my-3" alt="Tracking QR code">
              <p id="tracking-url" class="small text-muted text-break"></p>
              <button id="copy-tracking-url" class="btn btn-outline-secondary btn-sm" type="button">คัดลอกลิงก์</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/success.js"></script>
  </body>
</html>
